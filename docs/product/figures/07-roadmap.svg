60" width="108" height="84" rx="8" fill-opacity="0.16" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><rect x="146" y="60" width="108" height="6" rx="3" style="fill:var(--cds-chart-categorical-1)"></rect></g><text x="200" y="88" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">M1 Fabric v1</text><text x="200" y="110" text-anchor="middle" style="fill:var(--cds-text-secondary)">topology, P2P,</text><text x="200" y="126" text-anchor="middle" style="fill:var(--cds-text-secondary)">UCX, pools</text></g><g><g><rect x="266" y="60" width="108" height="84" rx="8" fill-opacity="0.16" stroke-width="1.5" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></rect><rect x="266" y="60" width="108" height="6" rx="3" style="fill:var(--cds-chart-categorical-2)"></rect></g><text x="320" y="88" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">M2 Exchange v1</text><text x="320" y="110" text-anchor="middle" style="fill:var(--cds-text-secondary)">shuffle, credits,</text><text x="320" y="126" text-anchor="middle" style="fill:var(--cds-text-secondary)">spill, pushdown</text></g><g><g><rect x="386" y="60" width="108" height="84" rx="8" fill-opacity="0.16" stroke-width="1.5" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></rect><rect x="386" y="60" width="108" height="6" rx="3" style="fill:var(--cds-chart-categorical-2)"></rect></g><text x="440" y="88" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">M3 Planner v2</text><text x="440" y="110" text-anchor="middle" style="fill:var(--cds-text-secondary)">adaptive, multi-</text><text x="440" y="126" text-anchor="middle" style="fill:var(--cds-text-secondary)">rail, on-path</text></g><g><g><rect x="506" y="60" width="108" height="84" rx="8" fill-opacity="0.16" stroke-width="1.5" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></rect><rect x="506" y="60" width="108" height="6" rx="3" style="fill:var(--cds-chart-categorical-3)"></rect></g><text x="560" y="88" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">M4 Runtime v1</text><text x="560" y="110" text-anchor="middle" style="fill:var(--cds-text-secondary)">Layer 2 jobs,</text><text x="560" y="126" text-anchor="middle" style="fill:var(--cds-text-secondary)">fault tolerance</text></g><g><g><rect x="626" y="60" width="108" height="84" rx="8" fill-opacity="0.16" stroke-width="1.5" style="fill:var(--cds-chart-categorical-4);stroke:var(--cds-chart-categorical-4)"></rect><rect x="626" y="60" width="108" height="6" rx="3" style="fill:var(--cds-chart-categorical-4)"></rect></g><text x="680" y="88" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--cds-text-primary)">M5 Query v1</text><text x="680" y="110" text-anchor="middle" style="fill:var(--cds-text-secondary)">Layer 3 SQL,</text><text x="680" y="126" text-anchor="middle" style="fill:var(--cds-text-secondary)">TPC-H</text></g><g><line x1="26" y1="172" x2="734" y2="172" stroke-width="1.25" style="stroke:var(--cds-chart-axis)"></line></g><g><polygon points="132,172 140,164 148,172 140,180" stroke-width="1.25" style="fill:var(--cds-chart-categorical-8);stroke:var(--cds-chart-categorical-8)"></polygon><text x="140" y="198" text-anchor="middle" style="fill:var(--cds-text-secondary)">prototype numbers</text><text x="140" y="212" text-anchor="middle" style="fill:var(--cds-text-secondary)">reproduced</text></g><g><polygon points="252,172 260,164 268,172 260,180" stroke-width="1.25" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></polygon><text x="260" y="198" text-anchor="middle" style="fill:var(--cds-text-secondary)">90% of link speed,</text><text x="260" y="212" text-anchor="middle" style="fill:var(--cds-text-secondary)">typed failures</text></g><g><polygon points="372,172 380,164 388,172 380,180" stroke-width="1.25" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></polygon><text x="380" y="198" text-anchor="middle" style="fill:var(--cds-text-secondary)">MGjoin ported,</text><text x="380" y="212" text-anchor="middle" style="fill:var(--cds-text-secondary)">no data loss</text></g><g><polygon points="492,172 500,164 508,172 500,180" stroke-width="1.25" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></polygon><text x="500" y="198" text-anchor="middle" style="fill:var(--cds-text-secondary)">multipath gain</text><text x="500" y="212" text-anchor="middle" style="fill:var(--cds-text-secondary)">measured</text></g><g><polygon points="612,172 620,164 628,172 620,180" stroke-width="1.25" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></polygon><text x="620" y="198" text-anchor="middle" style="fill:var(--cds-text-secondary)">survives a</text><text x="620" y="212" text-anchor="middle" style="fill:var(--cds-text-secondary)">worker kill</text></g><g><polygon points="718,172 726,164 734,172 726,180" stroke-width="1.25" style="fill:var(--cds-chart-categorical-4);stroke:var(--cds-chart-categorical-4)"></polygon><text x="734" y="198" text-anchor="end" style="fill:var(--cds-text-secondary)">TPC-H vs</text><text x="734" y="212" text-anchor="end" style="fill:var(--cds-text-secondary)">Spark RAPIDS</text></g></svg>
