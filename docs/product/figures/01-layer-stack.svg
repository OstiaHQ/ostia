<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" font-size="13"><style>svg{--cds-text-primary:#111827;--cds-text-secondary:#4b5563;--cds-chart-axis:#6b7280;--cds-chart-grid:#e5e7eb;--cds-chart-reference-tint:#f3f4f6;--cds-bg:#ffffff;--cds-chart-categorical-1:#2563eb;--cds-chart-categorical-2:#0d9488;--cds-chart-categorical-3:#d97706;--cds-chart-categorical-4:#9333ea;--cds-chart-categorical-5:#db2777;--cds-chart-categorical-6:#64748b;--cds-chart-categorical-7:#16a34a;--cds-chart-categorical-8:#78716c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{--cds-text-primary:#e5e7eb;--cds-text-secondary:#9ca3af;--cds-chart-axis:#9ca3af;--cds-chart-grid:#374151;--cds-chart-reference-tint:#1f2937;--cds-bg:#0d1117;--cds-chart-categorical-1:#60a5fa;--cds-chart-categorical-2:#2dd4bf;--cds-chart-categorical-3:#fbbf24;--cds-chart-categorical-4:#c084fc;--cds-chart-categorical-5:#f472b6;--cds-chart-categorical-6:#94a3b8;--cds-chart-categorical-7:#4ade80;--cds-chart-categorical-8:#a8a29e}}</style><rect width="100%" height="100%" rx="12" style="fill:var(--cds-bg)"/><text x="24" y="34" font-size="15" font-weight="600" style="fill:var(--cds-text-primary)">Each layer builds only on the one below; Layer 1 ships first</text><g><g><rect x="24" y="52" width="712" height="56" rx="8" fill-opacity="0.14" stroke-width="1.5" style="fill:var(--cds-chart-categorical-4);stroke:var(--cds-chart-categorical-4)"></rect><rect x="24" y="52" width="8" height="56" rx="4" style="fill:var(--cds-chart-categorical-4)"></rect></g><text x="44" y="85" font-size="14" font-weight="600" style="fill:var(--cds-text-primary)">Layer 3 · ostia-query</text><text x="260" y="85" style="fill:var(--cds-text-secondary)">SQL / dataframe plans to distributed GPU operators</text></g><g><g><rect x="24" y="124" width="712" height="56" rx="8" fill-opacity="0.14" stroke-width="1.5" style="fill:var(--cds-chart-categorical-3);stroke:var(--cds-chart-categorical-3)"></rect><rect x="24" y="124" width="8" height="56" rx="4" style="fill:var(--cds-chart-categorical-3)"></rect></g><text x="44" y="157" font-size="14" font-weight="600" style="fill:var(--cds-text-primary)">Layer 2 · ostia-runtime</text><text x="260" y="157" style="fill:var(--cds-text-secondary)">Workers, scheduler, fault tolerance, job submission</text></g><g><g><rect x="24" y="196" width="712" height="56" rx="8" fill-opacity="0.14" stroke-width="1.5" style="fill:var(--cds-chart-categorical-2);stroke:var(--cds-chart-categorical-2)"></rect><rect x="24" y="196" width="8" height="56" rx="4" style="fill:var(--cds-chart-categorical-2)"></rect></g><text x="44" y="229" font-size="14" font-weight="600" style="fill:var(--cds-text-primary)">Layer 1b · ostia-exchange</text><text x="260" y="229" style="fill:var(--cds-text-secondary)">Columnar shuffle, planner, backpressure, spill, pushdown</text></g><g><g><rect x="24" y="268" width="712" height="56" rx="8" fill-opacity="0.14" stroke-width="1.5" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><rect x="24" y="268" width="8" height="56" rx="4" style="fill:var(--cds-chart-categorical-1)"></rect></g><text x="44" y="301" font-size="14" font-weight="600" style="fill:var(--cds-text-primary)">Layer 1a · ostia-fabric</text><text x="260" y="301" style="fill:var(--cds-text-secondary)">Topology, transports, memory registration, byte P2P</text></g><g><g><rect x="24" y="340" width="712" height="56" rx="8" fill-opacity="0.14" stroke-width="1.5" style="fill:var(--cds-chart-categorical-6);stroke:var(--cds-chart-categorical-6)"></rect><rect x="24" y="340" width="8" height="56" rx="4" style="fill:var(--cds-chart-categorical-6)"></rect></g><text x="44" y="373" font-size="14" font-weight="600" style="fill:var(--cds-text-primary)">Hardware</text><text x="260" y="373" style="fill:var(--cds-text-secondary)">NVLink / NVSwitch · PCIe · NUMA · IB / RoCE · TCP / EFA</text