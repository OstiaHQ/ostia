orical-1)"></rect><text x="620" y="247" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">Command queue</text><text x="620" y="265" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">host today, device later</text></g><g><rect x="44" y="316" width="156" height="48" rx="8" fill-opacity="0.16" stroke-width="1.25" stroke-dasharray="none" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><text x="122" y="335" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">CUDA P2P / IPC</text><text x="122" y="353" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">inside a node</text></g><g><rect x="216" y="316" width="156" height="48" rx="8" fill-opacity="0.16" stroke-width="1.25" stroke-dasharray="none" style="fill:var(--cds-chart-categorical-1);stroke:var(--cds-chart-categorical-1)"></rect><text x="294" y="335" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">UCX</text><text x="294" y="353" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">GPUDirect · RoCE · TCP</text></g><g><rect x="388" y="316" width="156" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" style="stroke:var(--cds-chart-categorical-1)"></rect><text x="466" y="335" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">libfabric</text><text x="466" y="353" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">AWS EFA · later</text></g><g><rect x="560" y="316" width="156" height="48" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" stroke-dasharray="5 4" style="stroke:var(--cds-chart-categorical-1)"></rect><text x="638" y="335" text-anchor="middle" font-weight="600" style="fill:var(--cds-text-primary)">NVSHMEM / IBGDA</text><text x="638" y="353" text-anchor="middle" font-size="11.5" style="fill:var(--cds-text-secondary)">device-side