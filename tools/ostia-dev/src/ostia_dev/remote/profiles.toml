# Built-in node profiles, suites and windows for remote runs (RFC-0005 §3.3, §4.4, §4.8).
# Users override fields or add profiles in ~/.config/ostia/config.toml (§1.2), under
# [remote.k8s.profiles.<name>] and [remote.windows]; `ostia-dev remote k8s profiles`
# shows the merged result.
schema = 1

# The pod and container image (§4.5): Ubuntu 24.04 with the pixi version CI uses.
# Renovate bumps it together with CI's pixi-version and pixi.toml's requires-pixi.
image = "ghcr.io/prefix-dev/pixi:0.81.0-noble@sha256:788ae451641666e2d1f79d3dbe35392dfc7e9b394b16a3acb75c347f3badb2ab"

# How long each phase may take (§4.8); tests shorten them through [remote.windows].
[windows]
code_wait = "10m"         # the supervisor waits this long for the code
collect = "10m"           # and this long for the CLI to copy the results
ttl = "600s"              # ttlSecondsAfterFinished
margin = "15m"            # added to activeDeadlineSeconds
schedule_timeout = "20m"  # --schedule-timeout default
timeout = "60m"           # --timeout default: the pipeline inside the pod

# Node profiles (§4.4). requests equal limits; the fit check compares them with the
# allocatable resources of a node matching the selector.
[profiles.l4]
kind = "gpu"
gpus = 1
compute_capability = "8.9"
cpu = "6"                 # fits GKE's g2-standard-8 after system reservations
memory = "24Gi"
ephemeral_storage = "60Gi"
[profiles.l4.gke]
node_selector = { "cloud.google.com/gke-accelerator" = "nvidia-l4" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]
# GKE mounts its managed driver at /usr/local/nvidia, which the pixi image does not put on the paths
env = { PATH = "/usr/local/nvidia/bin:$PATH", LD_LIBRARY_PATH = "/usr/local/nvidia/lib64" }
[profiles.l4.eks]
node_selector = { "node.kubernetes.io/instance-type" = "g6.2xlarge" }   # or karpenter.k8s.aws/instance-gpu-name = "l4"
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]

[profiles.a100]
kind = "gpu"
gpus = 1
compute_capability = "8.0"
cpu = "10"                # fits GKE's a2-highgpu-1g (12 vCPU, 85 GB)
memory = "64Gi"
ephemeral_storage = "100Gi"
[profiles.a100.gke]
node_selector = { "cloud.google.com/gke-accelerator" = "nvidia-tesla-a100" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]
env = { PATH = "/usr/local/nvidia/bin:$PATH", LD_LIBRARY_PATH = "/usr/local/nvidia/lib64" }
[profiles.a100.eks]
node_selector = { "node.kubernetes.io/instance-type" = "p4d.24xlarge" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]
[profiles.a100.aks]
node_selector = { "node.kubernetes.io/instance-type" = "Standard_NC24ads_A100_v4" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]

[profiles.h100]
kind = "gpu"
gpus = 1
compute_capability = "9.0"
cpu = "12"                # fits EKS's p5.4xlarge (16 vCPU) and GKE's a3-highgpu-1g
memory = "96Gi"
ephemeral_storage = "100Gi"
[profiles.h100.gke]
node_selector = { "cloud.google.com/gke-accelerator" = "nvidia-h100-80gb" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]
env = { PATH = "/usr/local/nvidia/bin:$PATH", LD_LIBRARY_PATH = "/usr/local/nvidia/lib64" }
[profiles.h100.eks]
node_selector = { "node.kubernetes.io/instance-type" = "p5.4xlarge" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]
[profiles.h100.aks]
node_selector = { "node.kubernetes.io/instance-type" = "Standard_NC40ads_H100_v5" }
tolerations = [{ key = "nvidia.com/gpu", operator = "Exists", effect = "NoSchedule" }]

[profiles.cpu]
kind = "cpu"
cpu = "4"
memory = "16Gi"
ephemeral_storage = "20Gi"

# Suites (§3.3): named step lists run after the preflight and install steps. Placeholders:
# {build_dir} (the suite preset's build directory in the pod), {source_dir}, {env},
# {cc} (compute capability without the dot), {cc_dot}, {profile} and {run_id}.
[suites.gpu]
description = "every test at telemetry levels off, metrics, trace and debug"
preset = "dev"
# The dev preset must pick native when it sees the GPU (§4.9); checked by the CLI.
expect_summary = "architectures: native (dev preset, GPU detected ({cc_dot}))"
steps = [
  { name = "configure-dev", kind = "build", run = ["cmake", "--preset", "dev"] },
  { name = "configure-off", kind = "build", run = ["cmake", "--preset", "level-off", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build-off", kind = "build", run = ["cmake", "--build", "--preset", "level-off"] },
  { name = "test-off", kind = "command", run = ["ctest", "--test-dir", "{source_dir}/build/{env}/level-off", "--output-on-failure", "--output-junit", "{build_dir}/junit-off.xml"] },
  { name = "configure-metrics", kind = "build", run = ["cmake", "--preset", "level-metrics", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build-metrics", kind = "build", run = ["cmake", "--build", "--preset", "level-metrics"] },
  { name = "test-metrics", kind = "command", run = ["ctest", "--test-dir", "{source_dir}/build/{env}/level-metrics", "--output-on-failure", "--output-junit", "{build_dir}/junit-metrics.xml"] },
  { name = "configure-trace", kind = "build", run = ["cmake", "--preset", "level-trace", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build-trace", kind = "build", run = ["cmake", "--build", "--preset", "level-trace"] },
  { name = "test-trace", kind = "command", run = ["ctest", "--test-dir", "{source_dir}/build/{env}/level-trace", "--output-on-failure", "--output-junit", "{build_dir}/junit-trace.xml"] },
  { name = "configure-debug", kind = "build", run = ["cmake", "--preset", "level-debug", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build-debug", kind = "build", run = ["cmake", "--build", "--preset", "level-debug"] },
  { name = "test-debug", kind = "command", run = ["ctest", "--test-dir", "{source_dir}/build/{env}/level-debug", "--output-on-failure", "--output-junit", "{build_dir}/junit-debug.xml"] },
]

[suites.sanitizer]
description = "compute-sanitizer memcheck, racecheck and synccheck on the GPU test binaries"
preset = "level-debug"
steps = [
  { name = "configure", kind = "build", run = ["cmake", "--preset", "level-debug", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build", kind = "build", run = ["cmake", "--build", "--preset", "level-debug"] },
  { name = "memcheck", kind = "command", run = ["compute-sanitizer", "--tool", "memcheck", "--error-exitcode", "1", "{build_dir}/telemetry/tests/ostia_telemetry_gpu_tests"] },
  { name = "racecheck", kind = "command", run = ["compute-sanitizer", "--tool", "racecheck", "--error-exitcode", "1", "{build_dir}/telemetry/tests/ostia_telemetry_gpu_tests"] },
  { name = "synccheck", kind = "command", run = ["compute-sanitizer", "--tool", "synccheck", "--error-exitcode", "1", "{build_dir}/telemetry/tests/ostia_telemetry_gpu_tests"] },
  { name = "memcheck-p2p_copy", kind = "command", run = ["compute-sanitizer", "--tool", "memcheck", "--error-exitcode", "1", "{build_dir}/fabric/bench/ostia_fabric_bench_p2p_copy", "--smoke"] },
  { name = "memcheck-pipelining", kind = "command", run = ["compute-sanitizer", "--tool", "memcheck", "--error-exitcode", "1", "{build_dir}/fabric/bench/ostia_fabric_bench_pipelining", "--smoke"] },
  { name = "memcheck-batching", kind = "command", run = ["compute-sanitizer", "--tool", "memcheck", "--error-exitcode", "1", "{build_dir}/fabric/bench/ostia_fabric_bench_batching", "--smoke"] },
  { name = "memcheck-dual_link", kind = "command", run = ["compute-sanitizer", "--tool", "memcheck", "--error-exitcode", "1", "{build_dir}/fabric/bench/ostia_fabric_bench_dual_link", "--smoke"] },
]

[suites.bench-smoke]
description = "the benchmark driver end to end, and every fabric/bench program with --smoke"
preset = "release"
steps = [
  { name = "configure", kind = "build", run = ["cmake", "--preset", "release", "-DOSTIA_BUILD_BENCH=ON", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build", kind = "build", run = ["cmake", "--build", "--preset", "release"] },
  { name = "bench-driver", kind = "command", run = ["python", "{source_dir}/tools/bench/ostia_bench.py", "run", "--needs-gpu", "--runs", "3", "--bench", "{build_dir}/telemetry/bench/ostia_telemetry_bench_noop", "--build-dir", "{build_dir}", "--out", "{source_dir}/bench/results", "--run-id", "{run_id}"] },
  { name = "bench-programs", kind = "command", run = ["ctest", "--test-dir", "{build_dir}", "-R", "^fabric\\.bench\\.", "--output-on-failure", "--output-junit", "junit.xml"] },
]

[suites.overhead-aa]
description = "the overhead self-test (fails on a wrong verdict) and the A/A noise floor (reported only)"
preset = "release"
steps = [
  { name = "configure", kind = "build", run = ["cmake", "--preset", "release", "-DOSTIA_BUILD_BENCH=ON", "-DCMAKE_CUDA_ARCHITECTURES={cc}-real"] },
  { name = "build", kind = "build", run = ["cmake", "--build", "--preset", "release"] },
  { name = "self-test", kind = "command", run = ["python", "{source_dir}/tools/bench/overhead.py", "--target", "{profile}", "--self-test", "python {source_dir}/tools/bench/ostia_bench.py median-seconds --bench {build_dir}/telemetry/bench/ostia_telemetry_bench_noop"] },
  # A report step: its code and noise floor go into summary.json, never into the exit code
  { name = "aa", kind = "report", run = ["python", "{source_dir}/tools/bench/overhead.py", "--target", "{profile}", "--aa", "python {source_dir}/tools/bench/ostia_bench.py median-seconds --bench {build_dir}/telemetry/bench/ostia_telemetry_bench_noop"] },
]

[suites.cpu]
description = "build and ctest -L cpu"
preset = "dev"
steps = [
  { name = "configure", kind = "build", run = ["cmake", "--preset", "dev"] },
  { name = "build", kind = "build", run = ["cmake", "--build", "--preset", "dev"] },
  { name = "test", kind = "command", run = ["ctest", "--test-dir", "{build_dir}", "-L", "cpu", "--output-on-failure", "--output-junit", "junit.xml"] },
]
