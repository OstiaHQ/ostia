        - |
          # ostia-supervisor (golden stand-in)
          exit 0
        - ostia-supervisor
        env:
        - name: OSTIA_WORK
          value: /w
        - name: OSTIA_PLAN
          value: "gpu-preflight\tpreflight\tsh -c 'command -v nvidia-smi >/dev/null || { echo \"error: nvidia-smi not found on PATH=$PATH\"; echo \"  fix: set the profile'\"'\"'s env (PATH, LD_LIBRARY_PATH) for this provider\"; echo \"  see: RFC-0005 §4.9\"; exit 1; }; sh tools/ci/gpu_preflight.sh > .ostia/fingerprint.txt; rc=$?; cat .ostia/fingerprint.txt; exit $rc'\ncompute-capability\tpreflight\tsh -c 'cc=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -n 1); if [ \"$cc\" != \"8.9\" ]; then echo \"error: the GPU has compute capability ${cc:-unknown}, profile l4 expects 8.9\"; echo \"  rule: a run must land on the node type its profile names\"; echo \"  fix: check the node_selector of profile l4\"; echo \"  see: RFC-0005 §4.9\"; exit 1; fi; echo \"compute capability $cc: ok\"'\nlibcuda\tpreflight\tsh -c 'if ldconfig -p 2>/dev/null | grep -q '\"'\"'libcuda[.]so[.]1'\"'\"'; then echo \"libcuda.so.1: found by ldconfig\"; exit 0; fi; IFS=:; for d in ${LD_LIBRARY_PATH:-};\
            \ do if [ -e \"$d/libcuda.so.1\" ]; then echo \"libcuda.so.1: $d\"; exit 0; fi; done; echo \"error: libcuda.so.1 not found by ldconfig or in LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}\"; echo \"  fix: set the profile'\"'\"'s env (LD_LIBRARY_PATH) for this provider\"; echo \"  see: RFC-0005 §4.9\"; exit 1'\ninstall\tinstall\tpixi install --locked -e cuda-12\nconfigure\tbuild\tpixi run --frozen -e cuda-12 cmake --preset dev\nbuild\tbuild\tpixi run --frozen -e cuda-12 cmake --build --preset dev\ncommand\tcommand\tpixi run --frozen -e cuda-12 ctest --test-dir /w/build/cuda-12/dev --output-on-failure -j 6 --output-junit junit.xml"
        - name: OSTIA_ENV
          value: cuda-12
        - name: OSTIA_PRESET
          value: dev
        - name: OSTIA_BUILD_DIR
          value: /w/build/cuda-12/dev
        - name: OSTIA_CODE_WAIT
          value: '1200'
        - name: OSTIA_COLLECT_WINDOW
