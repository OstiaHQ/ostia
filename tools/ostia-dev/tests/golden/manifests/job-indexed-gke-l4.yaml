      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      subdomain: ostia-k8s-l4-20261002-141501-a1b2c3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                ostia.dev/run-id: k8s-l4-20261002-141501-a1b2c3
