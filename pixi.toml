# Development environments for Ostia (RFC-0001 §2.2). See docs/guides/building.md.
[workspace]
name = "ostia"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-arm64",
  # CUDA environments solve against a __cuda virtual package, so the CUDA-enabled
  # UCX builds are chosen even when locking on a machine without a GPU (RFC-0001 §2.2).
  { name = "linux-64-cuda-12", platform = "linux-64", cuda = "12" },
  { name = "linux-aarch64-cuda-12", platform = "linux-aarch64", cuda = "12" },
  { name = "linux-64-cuda-13", platform = "linux-64", cuda = "13" },
  { name = "linux-aarch64-cuda-13", platform = "linux-aarch64", cuda = "13" },
]
requires-pixi = ">=0.81"

# Tools shared by every environment (RFC-0001 §2.1, pixi row).
[dependencies]
cmake = ">=4.1,<5"
ninja = "*"
ccache = "*"
python = "3.12.*"
pip = "*"
pytest = "*"
pyyaml = "*"
scikit-build-core = ">=1.0.1"
ruff = "*"
gersemi = "*"
clang-format = "19.*"
clang-tools = "19.*"
python-clang = "19.*" # libclang bindings for ostia-dev check macros
pre-commit = "*"
typer = ">=0.27,<0.28"  # ostia-dev's argument parsing (RFC-0005 §2.4)
git = ">=2.56"          # CPM fetches inside remote pods, which cannot apt-get (RFC-0005 §2.4)
setuptools = ">=77"     # build backend of the ostia-dev editable, without build isolation
libhwloc = "2.12.*"     # topology fixture replay on every platform (RFC-0003 §9)

# rdma-core's infiniband/verbs.h, so ostia-topo-capture compiles its ibverbs probe in every
# environment; the library is dlopened at run time (RFC-0003 §1).
[target.linux-64.dependencies]
rdma-core = "65.*"
[target.linux-aarch64.dependencies]
rdma-core = "65.*"

# ostia-dev, the contributor CLI, editable in every environment (RFC-0005 §1.1).
[pypi-dependencies]
ostia-dev = { path = "tools/ostia-dev", editable = true }

[pypi-options]
no-build-isolation = ["ostia-dev"] # setuptools comes from conda-forge and the lock

[activation.env]
OSTIA_BUILD_ROOT = "$PIXI_PROJECT_ROOT/build/$PIXI_ENVIRONMENT_NAME"
# Keep a contributor's own CPM cache if they set one.
CPM_SOURCE_CACHE = "${CPM_SOURCE_CACHE:-$PIXI_PROJECT_ROOT/.cache/cpm}"

# Host toolchain of the default environment: GCC 14 on Linux, conda-forge Clang 19 + libc++ on macOS.
[feature.host-toolchain.activation.env]
OSTIA_ENABLE_CUDA = "OFF" # default is host-only (RFC-0001 §2.2); plain CMake keeps AUTO
[feature.host-toolchain.target.linux-64.dependencies]
gxx_linux-64 = "14.*"
[feature.host-toolchain.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "14.*"
[feature.host-toolchain.target.osx-arm64.dependencies]
clangxx_osx-arm64 = "19.*"
libcxx = ">=19"
[feature.host-toolchain.target.osx-arm64.activation.env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Linux-only environments for CI's compiler matrix (RFC-0001 §4.1). Host-only.
[feature.linux]
platforms = ["linux-64", "linux-aarch64"]
[feature.linux.activation.env]
OSTIA_ENABLE_CUDA = "OFF"

[feature.gcc11.target.linux-64.dependencies]
gxx_linux-64 = "11.*"
[feature.gcc11.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "11.*"

[feature.gcc14.target.linux-64.dependencies]
gxx_linux-64 = "14.*"
[feature.gcc14.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "14.*"

# Only for the out-of-range host-compiler configure test (RFC-0001 §1 Done when).
[feature.gcc15.target.linux-64.dependencies]
gxx_linux-64 = "15.*"
[feature.gcc15.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "15.*"

# llvm-tools (llvm-profdata, llvm-cov) and coverage.py are for `ostia-dev coverage`.
[feature.clang.dependencies]
llvm-tools = "19.*"
coverage = "*"
[feature.clang.target.linux-64.dependencies]
clangxx_linux-64 = "19.*"
[feature.clang.target.linux-aarch64.dependencies]
clangxx_linux-aarch64 = "19.*"

# UCX over TCP for the CPU multi-process harness (RFC-0001 §4.1 multiprocess-tcp).
[feature.ucx-cpu.dependencies]
ucx = "*"
rdma-core = "*"

# CUDA 12.8 (the floor) and 13.4 (CI's 13.x), RFC-0001 §1.1-§1.2. The compiler comes from
# the environment: GCC 11 with 12.8, GCC 14 with 13.4.
[feature.cuda-12]
platforms = ["linux-64-cuda-12", "linux-aarch64-cuda-12"]
[feature.cuda-12.activation.env]
OSTIA_ENABLE_CUDA = "ON"
[feature.cuda-12.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"
cuda-sanitizer-api = "12.8.*" # compute-sanitizer for remote runs' sanitizer suite (RFC-0005 §3.3)
cuda-profiler-api = "12.8.*" # nvbench (RFC-0001 §6.1)
ucx = "*"
rdma-core = "*"

[feature.cuda-13]
platforms = ["linux-64-cuda-13", "linux-aarch64-cuda-13"]
[feature.cuda-13.activation.env]
OSTIA_ENABLE_CUDA = "ON"
[feature.cuda-13.dependencies]
cuda-version = "13.4.*"
cuda-nvcc = "13.4.*"
cuda-cudart-dev = "13.4.*"
cuda-sanitizer-api = "13.4.*"
cuda-profiler-api = "13.4.*"
ucx = "*"
rdma-core = "*"

# CI-only: kind for remote.yml's end-to-end k8s job (RFC-0005 Testing).
[feature.remote-ci.dependencies]
kubernetes-kind = "0.33.*"

[environments]
default = { features = ["host-toolchain"] }
remote-ci = { features = ["host-toolchain", "remote-ci"] }
cuda-12 = { features = ["cuda-12", "gcc11"] }
cuda-13 = { features = ["cuda-13", "gcc14"] }
gcc11 = { features = ["linux", "gcc11"] }
clang = { features = ["linux", "clang"] }
ucx = { features = ["linux", "gcc14", "ucx-cpu"] }
gcc15 = { features = ["linux", "gcc15"] }

[tasks]
# The one task pixi keeps: its inputs/outputs cache decides when to reconfigure. Every
# command is `pixi run ostia-dev …` (RFC-0005 §2.2).
_configure = { cmd = "cmake --preset dev", inputs = [
  "CMakePresets.json",
  "pixi.lock",
], outputs = [
  "build/{{ pixi.environment.name }}/dev/CMakeCache.txt",
], description = "Configure the dev preset (re-runs only when presets or the lock change)" }
