# Development environments for Ostia (RFC-0001 §2.2). See docs/guides/building.md.
[workspace]
name = "ostia"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-arm64",
  # CUDA environments solve against a __cuda virtual package, so the CUDA-enabled
  # UCX builds are chosen even when locking on a machine without a GPU (RFC-0001 §2.2).
  { name = "linux-64-cuda-12", platform = "linux-64", cuda = "12" },
  { name = "linux-aarch64-cuda-12", platform = "linux-aarch64", cuda = "12" },
  { name = "linux-64-cuda-13", platform = "linux-64", cuda = "13" },
  { name = "linux-aarch64-cuda-13", platform = "linux-aarch64", cuda = "13" },
]
requires-pixi = ">=0.81"

# Tools shared by every environment (RFC-0001 §2.1, pixi row).
[dependencies]
cmake = ">=4.1,<5"
ninja = "*"
ccache = "*"
python = "3.12.*"
pip = "*"
pytest = "*"
scikit-build-core = ">=1.0.1"
ruff = "*"
gersemi = "*"
clang-format = "19.*"
clang-tools = "19.*"
python-clang = "19.*" # libclang bindings for tools/ci/check_telemetry_macros.py
pre-commit = "*"

[activation.env]
OSTIA_BUILD_ROOT = "$PIXI_PROJECT_ROOT/build/$PIXI_ENVIRONMENT_NAME"
# Keep a contributor's own CPM cache if they set one.
CPM_SOURCE_CACHE = "${CPM_SOURCE_CACHE:-$PIXI_PROJECT_ROOT/.cache/cpm}"

# Host toolchain of the default environment: GCC 14 on Linux, conda-forge Clang 19 + libc++ on macOS.
[feature.host-toolchain.activation.env]
OSTIA_ENABLE_CUDA = "OFF" # default is host-only (RFC-0001 §2.2); plain CMake keeps AUTO
[feature.host-toolchain.target.linux-64.dependencies]
gxx_linux-64 = "14.*"
[feature.host-toolchain.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "14.*"
[feature.host-toolchain.target.osx-arm64.dependencies]
clangxx_osx-arm64 = "19.*"
libcxx = ">=19"
[feature.host-toolchain.target.osx-arm64.activation.env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Linux-only environments for CI's compiler matrix (RFC-0001 §4.1). Host-only.
[feature.linux]
platforms = ["linux-64", "linux-aarch64"]
[feature.linux.activation.env]
OSTIA_ENABLE_CUDA = "OFF"

[feature.gcc11.target.linux-64.dependencies]
gxx_linux-64 = "11.*"
[feature.gcc11.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "11.*"

[feature.gcc14.target.linux-64.dependencies]
gxx_linux-64 = "14.*"
[feature.gcc14.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "14.*"

# Only for the out-of-range host-compiler configure test (RFC-0001 §1 Done when).
[feature.gcc15.target.linux-64.dependencies]
gxx_linux-64 = "15.*"
[feature.gcc15.target.linux-aarch64.dependencies]
gxx_linux-aarch64 = "15.*"

[feature.clang.target.linux-64.dependencies]
clangxx_linux-64 = "19.*"
[feature.clang.target.linux-aarch64.dependencies]
clangxx_linux-aarch64 = "19.*"

# UCX over TCP for the CPU multi-process harness (RFC-0001 §4.1 multiprocess-tcp).
[feature.ucx-cpu.dependencies]
ucx = "*"
rdma-core = "*"

# CUDA 12.8 (the floor) and 13.4 (CI's 13.x), RFC-0001 §1.1-§1.2. The compiler comes from
# the environment: GCC 11 with 12.8, GCC 14 with 13.4.
[feature.cuda-12]
platforms = ["linux-64-cuda-12", "linux-aarch64-cuda-12"]
[feature.cuda-12.activation.env]
OSTIA_ENABLE_CUDA = "ON"
[feature.cuda-12.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "12.8.*"
cuda-cudart-dev = "12.8.*"
cuda-sanitizer-api = "12.8.*" # compute-sanitizer for remote runs' sanitizer suite (RFC-0005 §3.3)
cuda-profiler-api = "12.8.*" # nvbench (RFC-0001 §6.1)
ucx = "*"
rdma-core = "*"

[feature.cuda-13]
platforms = ["linux-64-cuda-13", "linux-aarch64-cuda-13"]
[feature.cuda-13.activation.env]
OSTIA_ENABLE_CUDA = "ON"
[feature.cuda-13.dependencies]
cuda-version = "13.4.*"
cuda-nvcc = "13.4.*"
cuda-cudart-dev = "13.4.*"
cuda-sanitizer-api = "13.4.*"
cuda-profiler-api = "13.4.*"
ucx = "*"
rdma-core = "*"

[environments]
default = { features = ["host-toolchain"] }
cuda-12 = { features = ["cuda-12", "gcc11"] }
cuda-13 = { features = ["cuda-13", "gcc14"] }
gcc11 = { features = ["linux", "gcc11"] }
clang = { features = ["linux", "clang"] }
ucx = { features = ["linux", "gcc14", "ucx-cpu"] }
gcc15 = { features = ["linux", "gcc15"] }

[tasks]
_configure = { cmd = "cmake --preset dev", inputs = [
  "CMakePresets.json",
  "pixi.lock",
], outputs = [
  "build/{{ pixi.environment.name }}/dev/CMakeCache.txt",
], description = "Configure the dev preset (re-runs only when presets or the lock change)" }
build = { cmd = "cmake --build --preset dev", depends-on = [
  "_configure",
], description = "Build the dev preset" }
test-cpp = { cmd = "ctest --preset dev", depends-on = [
  "build",
], description = "Run C++ and CMake tests; extra args go to ctest, e.g. -R Result" }
install-native = { cmd = "cmake --install $OSTIA_BUILD_ROOT/dev --prefix $CONDA_PREFIX && cmake -E copy $OSTIA_BUILD_ROOT/dev/install_manifest.txt $OSTIA_BUILD_ROOT/native-install-manifest.txt", depends-on = [
  "build",
], description = "Install libostia-* into the pixi environment (RFC-0001 §3.5)" }
py-dev = { cmd = "python tools/dev/py_dev.py --preset dev", depends-on = [
  "install-native",
], description = "Build native code and install the Python editables; the documented rebuild after a native change" }
test-py = { cmd = "pytest", depends-on = [
  "py-dev",
], description = "Run Python tests (extra args go to pytest)" }
test = { depends-on = ["test-cpp", "test-py"], description = "Run all tests" }
test-rebuild = { cmd = "pytest -m slow tests/python", depends-on = [
  "py-dev",
], description = "Slow tests: native change visible after rebuild, py-dev idempotency" }
lint = { cmd = "python tools/ci/lint.py lint", description = "Fast checks: format, ruff, gersemi, include layering, CPM pins, docs index" }
fmt = { cmd = "python tools/ci/lint.py fmt", description = "Apply clang-format, ruff and gersemi" }
check-graph = { cmd = "cmake --preset dev --graphviz=$OSTIA_BUILD_ROOT/dev/ostia.dot && python tools/ci/check_graph.py --dot $OSTIA_BUILD_ROOT/dev/ostia.dot", depends-on = [
  "_configure",
], description = "Check resolved link edges against the layering table (reconfigures)" }
check-macros = { cmd = "python tools/ci/check_telemetry_macros.py --build $OSTIA_BUILD_ROOT/dev", depends-on = [
  "_configure",
], description = "Telemetry macro arguments must not change state (RFC-0001 §5; parses with libclang)" }
check = { depends-on = [
  "lint",
  "check-graph",
  "check-macros",
  "test",
], description = "Everything CI requires (RFC-0001 §4.1)" }
tidy = { cmd = "run-clang-tidy -quiet -p $OSTIA_BUILD_ROOT/dev", depends-on = [
  "_configure",
], description = "clang-tidy over the compile database (slow; manual pre-commit stage)" }
doctor = { cmd = "python tools/dev/doctor.py", description = "Print the environment and diagnose common problems" }
clean = { cmd = "python tools/dev/clean.py", description = "Remove build output and everything py-dev installed into the environment" }
hooks = { cmd = "pre-commit install", description = "Install the git pre-commit hook (runs pixi run lint)" }
docs-index = { cmd = "python tools/docs/gen_index.py", description = "Regenerate the RFC/ADR index in docs/README.md" }
check-cuda = { cmd = "python tools/dev/check_cuda.py", description = "Compile the CUDA code with nvcc in a linux/arm64 container (no GPU needed)" }
sanitize-asan = { cmd = "cmake --preset asan-ubsan && cmake --build --preset asan-ubsan && ctest --preset asan-ubsan", description = "Build and test with AddressSanitizer + UBSan (CI: pixi run -e clang sanitize-asan)" }
sanitize-tsan = { cmd = "cmake --preset tsan && cmake --build --preset tsan && ctest --preset tsan", description = "Build and test with ThreadSanitizer (CI: pixi run -e clang sanitize-tsan)" }
test-multiprocess = { cmd = "ctest --preset dev -L multiprocess", depends-on = [
  "build",
], description = "Multi-process tests over UCX TCP loopback (Linux: pixi run -e ucx test-multiprocess)" }
docs-as-test = { cmd = "python tools/ci/docs_as_test.py", description = "Run building.md's quick-start commands verbatim (CI runs it on a fresh runner)" }
test-preset = { cmd = "cmake --preset {{ preset }} && cmake --build --preset {{ preset }} && ctest --preset {{ preset }}", args = [
  "preset",
], description = "Configure, build and test one preset, e.g. pixi run test-preset level-off" }
test-levels = { depends-on = [
  { task = "test-preset", args = [
    "level-off",
  ] },
  { task = "test-preset", args = [
    "level-metrics",
  ] },
  { task = "test-preset", args = [
    "level-trace",
  ] },
  { task = "test-preset", args = [
    "level-debug",
  ] },
], description = "Build and test all four telemetry levels (RFC-0001 §5)" }
bench = { cmd = "python tools/bench/ostia_bench.py", description = "Run a benchmark and record schema-1 results (docs/guides/benchmarks.md)" }
compare = { cmd = "python tools/bench/compare.py", description = "Compare benchmark results with a baseline (RFC-0001 §6.3)" }
