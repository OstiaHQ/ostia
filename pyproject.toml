# Tool configuration only. Packages live in <component>/python/pyproject.toml.
[tool.pytest.ini_options]
testpaths = ["tests/python", "tools", "telemetry/tools"]
pythonpath = ["."]
addopts = "-m 'not slow and not gpu and not kind'"
markers = [
    "slow: rebuilds native code; run with `pixi run ostia-dev test rebuild`",
    "gpu: needs a CUDA device",
    "kind: needs a kind cluster (RFC-0005 Testing); the remote.yml kind job runs them",
]

# `ostia-dev coverage` (Python half); relative paths so Codecov can map them to the repository.
[tool.coverage.run]
source = [
    "tools/ostia-dev/src",
    "fabric/python/src",
    "telemetry/python/src",
    "telemetry/tools",
]
omit = ["*/tests/*", "*/test_*.py"]
relative_files = true
data_file = "build/.coverage"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
