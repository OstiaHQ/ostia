# Keeps pinned GitHub Actions up to date. pixi packages and CPM pins are updated by
# self-hosted Renovate (.github/workflows/renovate.yml, RFC-0001 §2.4); Dependabot supports neither.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "📦️ build"
      include: scope
    labels: ["component: build"]
    groups:
      actions:
        patterns: ["*"]
