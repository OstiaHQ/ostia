# The ostia-dev remote pipeline end to end, without a GPU (RFC-0005 Testing).
# Path-filtered on pull requests, so it can't be a required check.
name: Remote

on:
  pull_request:
    paths:
      - tools/ostia-dev/**
      - tools/ci/gpu_preflight.sh
      - pixi.toml
      - pixi.lock
      - .github/workflows/remote.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-backend:
    name: container-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: A stale pixi.lock is exit 2 before any container starts
        run: |
          sed -i 's/^pyyaml = "\*"$/pyyaml = "*"\nsix = "*"/' pixi.toml
          set +e
          out=$(pixi run --frozen ostia-dev -v remote container --engine docker --env default --suite cpu 2>&1)
          code=$?
          set -e
          git checkout pixi.toml
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q 'error: pixi.lock is out of date with pixi.toml'
          if echo "$out" | grep -qE '^\+ .*docker (run|create)'; then exit 1; fi
          test -z "$(docker ps -aq --filter label=ostia.dev/managed=true)"
      - name: pixi run ostia-dev remote container --engine docker --env default --suite cpu
        run: pixi run ostia-dev remote container --engine docker --env default --suite cpu
      - name: A failing command exits 1
        run: |
          set +e
          pixi run ostia-dev remote container --engine docker --env default --no-build -- false
          code=$?
          set -e
          test "$code" -eq 1
      - name: Nothing is left behind
        if: always()
        run: test -z "$(docker ps -aq --filter label=ostia.dev/managed=true)"
      - name: Upload the results
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-container-results
          path: build/remote/
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          {
            echo "### container-backend"
            echo "Reproduce: \`pixi run ostia-dev remote container --env default --suite cpu\`"
            echo '```'
            for f in build/remote/*/summary.json; do
              python3 -c "import json,sys; s=json.load(open(sys.argv[1])); print(s['run_id'], s['result'], s['exit_code'])" "$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  kind:
    name: kind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OSTIA_CONFIG: tools/ostia-dev/tests/kind/config.toml
      KIND_NODE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          environment: remote-ci
      - name: Create the kind cluster
        run: pixi run -e remote-ci kind create cluster --name ostia --image "$KIND_NODE" --wait 120s
      - name: pixi run ostia-dev remote k8s init --context kind-ostia --namespace ostia-test
        run: pixi run ostia-dev remote k8s init --context kind-ostia --namespace ostia-test
      - name: Remote k8s runs, policies and admission against kind
        env:
          OSTIA_KIND_NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: pixi run pytest -m kind tools/ostia-dev/tests/kind -v
      - name: Cluster state
        if: always()
        run: |
          k="$(pixi run ostia-dev remote k8s kubectl | cut -d' ' -f1)"
          "$k" --context kind-ostia get all,networkpolicies,resourcequotas -A || true
          "$k" --context kind-ostia get events -A --sort-by=.lastTimestamp | tail -80 || true
      - name: Upload the results
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-kind-results
          path: build/remote/
          if-no-files-found: warn
      - name: Delete the kind cluster
        if: always()
        run: pixi run -e remote-ci kind delete cluster --name ostia
