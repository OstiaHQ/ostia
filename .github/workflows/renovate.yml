# Self-hosted Renovate: updates pixi (pixi.toml and pixi.lock) and CPM pins
# (RFC-0001 §2.4). Dependabot keeps updating GitHub Actions only.
# Needs the RENOVATE_TOKEN secret: a GitHub App or fine-grained token with contents,
# pull requests and workflows write access to this repository.
name: Renovate

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Renovate
        # renovatebot/github-action v46.3.5
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d
        with:
          configurationFile: .github/renovate-global.js
          token: ${{ secrets.RENOVATE_TOKEN }}
