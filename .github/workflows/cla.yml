# Asks every outside contributor to sign the Individual CLA once, by comment,
# and records signatures on the cla-signatures branch. See CONTRIBUTING.md.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    # Job-scoped so no other job can inherit write access (OpenSSF Scorecard Token-Permissions).
    # The action commits signatures to cla-signatures, comments on the PR and sets the cla status.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check or record CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # contributor-assistant/github-action v2.6.1, pinned by commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/OstiaHQ/ostia/blob/main/docs/legal/individual-cla.md
          path-to-signatures: signatures/individual-cla-v1.json
          branch: cla-signatures
          allowlist: ShAlireza,dependabot[bot],github-actions[bot]
