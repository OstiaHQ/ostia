name: 🐛 Bug report
description: Something doesn't work as documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, don't use this form; see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [ostia-fabric, ostia-exchange, ostia-runtime, ostia-query, ostia-telemetry, build / packaging, docs, not sure]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest program, command or configuration that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and topology
      description: GPUs and count, NVLink/NVSwitch, NICs and fabric (InfiniBand, RoCE, TCP, EFA), number of nodes. `nvidia-smi topo -m` output helps.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Software environment
      description: Ostia version or commit, OS, driver and CUDA versions, UCX version, telemetry build level (off, metrics, trace, debug).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, traces or error output
      render: text
