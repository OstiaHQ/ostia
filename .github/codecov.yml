# Codecov settings for the `coverage` CI job. Report only: statuses are informational, so
# coverage never blocks a merge; add a target once there's a baseline.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  cpp:
    paths: [fabric/, telemetry/]
    carryforward: true
  python:
    paths: [tools/, fabric/python/, telemetry/python/, telemetry/tools/]
    carryforward: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
