# Install with `pixi run ostia-dev hooks`. Hooks call the same ostia-dev commands as CI
# (RFC-0001 §3.3, §4.1).
repos:
  - repo: local
    hooks:
      - id: lint
        name: pixi run ostia-dev lint
        entry: pixi run ostia-dev lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: clang-tidy
        name: pixi run ostia-dev check tidy
        entry: pixi run ostia-dev check tidy
        language: system
        pass_filenames: false
        stages: [manual]
