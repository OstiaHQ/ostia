# Install with `pixi run hooks`. Hooks call the same pixi tasks as CI (RFC-0001 §3.3, §4.1).
repos:
  - repo: local
    hooks:
      - id: lint
        name: pixi run lint
        entry: pixi run lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: clang-tidy
        name: pixi run tidy
        entry: pixi run tidy
        language: system
        pass_filenames: false
        stages: [manual]
